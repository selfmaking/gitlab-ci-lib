#==============================================================================
# Assuming that we have these deployment environments:
# 'develop', 'testing', 'staging', 'production'.
# Git Flow is recommended, so we are facing these git branches:
# 'main|master', 'develop', 'release/*', 'hotfix/*', 'feature/*'.
#==============================================================================

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 3
  CACHE_KEY: "ci-cache-${CI_PROJECT_ID}-${CI_PROJECT_NAME}"


.image01: &image_for_deploy { image: 'node:16.17' }
.image02: &image_for_build  { image: 'node:16.17' }
.cache01: &build_runner_cache
  <<: *image_for_build
  cache: {
    policy: pull-push, untracked: false, key: "${CACHE_KEY}",
    paths: [ 'node_modules/' ] }

#===============================================================================

stages: [ first, build, deploy, verify, final ]

.rules_develop: &rules_develop { rules: [ { when: on_success, if: $CI_COMMIT_BRANCH == 'develop' } ] }
.rules_testing: &rules_testing { rules: [ { when: on_success, if: $CI_COMMIT_BRANCH =~ /^release\/.*$/ } ] }
.rules_staging: &rules_staging
  rules:
    - when: on_success
      if: $CI_COMMIT_BRANCH =~ /^hotfix\/.*$/
    - when: on_success
      if: $CI_COMMIT_TAG =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)$/
    - when: on_success
      if: $CI_COMMIT_TAG =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
    - when: on_success
      if: $CI_COMMIT_TAG =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-\w+(\.\w+)*)?(\+\w+(\.\w+)*)?$/
.rules_default: &rules_default
  rules:
    - when: manual
      if: $CI_COMMIT_BRANCH =~ /^feature\/.*$/
    - when: manual
      if: $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH == 'master'

.common_layer_functions:
  - &init_common_func |
    SELF_LIB_VERSION="${GITLAB_CI_LIB_VERSION:-custom/zxq}";
    SELF_LIB_URL="${SELF_LIB_URL:=https://raw.githubusercontent.com/selfmaking/gitlab-ci-lib/${GITLAB_CI_LIB_VERSION:?}/.gitlab-ci.lib.sh}";
    echo 'SELF_LIB_URL' "${SELF_LIB_URL}";
    . <(curl -s "${SELF_LIB_URL}");
    define_common_init
  - &init_ssh_common_func define_common_init_ssh
  - &build_common_func    define_common_build
  - &upload_common_func   define_common_upload
  - &deploy_common_func   define_common_service; define_common_deploy
  - &verify_common_func   define_common_service; define_common_verify

.custom_layer_functions:
  - &init_custom_func |
    [[ -f "${CI_PROJECT_DIR:?}/.gitlab-ci.sh" ]] && {
      . "${CI_PROJECT_DIR}/.gitlab-ci.sh" ;
      echo "Sourced with exit code: ${?}"
    } ; pwd ;
  - &build_custom_func  do_func_invoke 'define_custom_build'
  - &upload_custom_func init_inject_cd_bash_do; do_func_invoke 'define_custom_upload'
  - &deploy_custom_func init_inject_cd_bash_do; do_func_invoke 'define_custom_deploy'
  - &verify_custom_func init_inject_cd_bash_do; do_func_invoke 'define_custom_verify'

.build_only: &build_only
  stage: build
  <<: *build_runner_cache
  before_script:
    - *init_custom_func
    - *init_common_func
    - do_func_invoke 'define_custom_init'
    - init_first_do
  script:
    - *init_ssh_common_func
    - init_ssh_do
    - init_inject_ci_bash_do
    - init_final_do
    - *build_common_func
    - *build_custom_func
    - build_job_do

.build_then_upload: &build_then_upload
  <<: *build_only
  script:
    - *init_ssh_common_func
    - init_ssh_do
    - init_inject_ci_bash_do
    - init_final_do
    - *build_common_func
    - *build_custom_func
    - build_job_do
    - *upload_common_func
    - *upload_custom_func
    - upload_job_do

.deploy_with_ssh: &deploy_with_ssh
  <<: *image_for_deploy
  before_script:
    - *init_custom_func
    - *init_common_func
    - do_func_invoke 'define_custom_init'
    - init_first_do
    - *init_ssh_common_func
    - init_ssh_do
  allow_failure: true

.deploy_to_env: &deploy_to_env
  <<: *deploy_with_ssh
  stage: deploy
  script:
    - *deploy_common_func
    - init_inject_ci_bash_do
    - init_final_do
    - *deploy_custom_func
    - deploy_job_do

.deploy_verify_env: &deploy_verify_env
  <<: *deploy_with_ssh
  stage: verify
  script:
    - *verify_common_func
    - init_inject_ci_bash_do
    - init_final_do
    - *verify_custom_func
    - verify_job_do

#===============================================================================

package:
  variables: { ENV_NAME: develop, GIT_CHECKOUT: "true" }
  <<: *build_only
  <<: *rules_default

#===============================================================================

for-develop:
  variables: { ENV_NAME: develop, GIT_CHECKOUT: "true" }
  <<: *build_then_upload
  <<: *rules_develop
to-develop:
  variables: { ENV_NAME: develop, GIT_CHECKOUT: "true" }
  <<: *deploy_to_env
  <<: *rules_develop
env-develop:
  variables: { ENV_NAME: develop, GIT_CHECKOUT: "true" }
  <<: *deploy_verify_env
  <<: *rules_develop

#===============================================================================

for-testing:
  variables: { ENV_NAME: testing, GIT_CHECKOUT: "true" }
  <<: *build_then_upload
  <<: *rules_testing
to-testing:
  variables: { ENV_NAME: testing, GIT_CHECKOUT: "true" }
  <<: *deploy_to_env
  <<: *rules_testing
env-testing:
  variables: { ENV_NAME: testing, GIT_CHECKOUT: "true" }
  <<: *deploy_verify_env
  <<: *rules_testing

#===============================================================================

for-staging:
  variables: { ENV_NAME: staging, GIT_CHECKOUT: "true" }
  <<: *build_then_upload
  <<: *rules_staging
to-staging:
  variables: { ENV_NAME: staging, GIT_CHECKOUT: "true" }
  <<: *deploy_to_env
  <<: *rules_staging
env-staging:
  variables: { ENV_NAME: staging, GIT_CHECKOUT: "true" }
  <<: *deploy_verify_env
  <<: *rules_staging

#===============================================================================

for-production-beta:
  variables: { ENV_NAME: production, GIT_CHECKOUT: "true" }
  <<: *build_then_upload
  stage: build
  only: [ /^hotfix\/.*$/ ]
  when: manual

for-production:
  variables: { ENV_NAME: production, GIT_CHECKOUT: "true" }
  <<: *build_then_upload
  stage: build
  only: [ tags ]
  except: [ /^(!main).+$/, /^(!master).+$/ ]
  when: manual

#===============================================================================
